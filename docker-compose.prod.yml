services:
  web:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    volumes:
      - static_volume:/home/app/web/static
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput && 
        gunicorn app.wsgi:application --bind 0.0.0.0:9000",
      ]
    expose:
      - 9000
    env_file:
      - .env.prod
    depends_on:
      - db
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser"]
      interval: 30s
      timeout: 30s
      retries: 3
    
    env_file:
      - .env.prod.db
  nginx:
    build: ./nginx
    ports:
      - 80:80
    volumes:
      - static_volume:/home/app/web/static
    depends_on:
      - web
volumes:
  postgres_data:
  static_volume:
