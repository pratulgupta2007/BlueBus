{% extends "base_generic.html" %}


{% block content %}
<h2 class="text-3xl font-semibold mb-6 text-center text-blue-600">Search for Buses</h2>
<section id="search" class="my-8 p-6 bg-white shadow-lg rounded-lg">
    <form action="/search" method="get" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div>
                <label for="from" class="block text-xl font-medium text-gray-700">From</label>
                <input type="text" id="from" name="from" class="mt-2 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 h-10" required>
            </div>
            <div>
                <label for="to" class="block text-xl font-medium text-gray-700">To</label>
                <input type="text" id="to" name="to" class="mt-2 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 h-10" required>
            </div>
            <div>
                <label for="date" class="block text-xl font-medium text-gray-700">Date</label>
                <input type="date" id="date" name="date" class="mt-2 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 h-10" required>
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-6 rounded-lg hover:bg-blue-700 transition duration-300">Search</button>
            </div>
        </div>
    </form>
</section>

{% endblock %}
