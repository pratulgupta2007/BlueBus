{% extends "base_generic.html" %}

{% block content %}

<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
    <div class="text-center mb-6">
      <h4 class="text-2xl font-bold text-gray-800">Add Balance</h4>
    </div>
    <div class="text-center mb-6">
      <p class="text-lg font-medium text-gray-700">Current Balance: {{ balance }}</p>
    </div>
    <form method="post" class="space-y-6">
      {% csrf_token %}
      <div>
        <label for="amount" class="block text-lg font-medium text-gray-700">Amount</label>
        <input type="number" name="amount" id="amount" class="mt-2 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 h-12 px-4" required>
      </div>
      <div class="flex justify-center">
        <input type="hidden" name="next" value="{{ request.path }}">
        <button type="submit" class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition duration-300">Add Balance</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
